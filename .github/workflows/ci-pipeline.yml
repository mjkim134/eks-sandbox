name: eks-demo CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'eks-demo/**'
      - '.github/workflows/ci-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'eks-demo/**'
      - '.github/workflows/ci-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: ap-northeast-2
  APP_NAME: eks-demo
  TRIVY_VERSION: 0.74.0
  VALUES_FILE: helm-values/dev/eks-demo-values.yaml

jobs:
  # PR: 테스트 → 이미지 빌드 → 취약점 게이트 (AWS 접근 없음, 읽기 권한만)
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./eks-demo
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build image
        run: docker build -t "${APP_NAME}:ci" .

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Trivy 게이트 (고칠 수 있는 CRITICAL이 있으면 실패)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "${APP_NAME}:ci"

  # main push: 테스트 → 빌드 → 스캔 → ECR push → helm 태그 갱신
  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # helm values 커밋/푸시
      id-token: write   # AWS OIDC
    defaults:
      run:
        working-directory: ./eks-demo
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Set image tag
        id: vars
        run: echo "tag=d${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ secrets.ASSUME_IAM_ROLE }}
          role-session-name: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: echo "IMAGE=${REGISTRY}/${APP_NAME}:${TAG}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" .

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Trivy 게이트 (push 전 검사)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Update image tag
        working-directory: .
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        # image: 블록 안의 tag 줄만 교체 (다음 최상위 키에서 범위 종료, 파일 서식은 유지)
        run: sed -i -E "/^image:/,/^[^[:space:]#]/ s|^([[:space:]]+tag:).*|\1 \"${TAG}\"|" "$VALUES_FILE"

      - name: Commit and push tag
        working-directory: .
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name  "mjkim134"
          git config user.email "mjkim134@gmail.com"
          git add "$VALUES_FILE"
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update Tag - ${TAG}"
          git pull --rebase origin main
          git push origin main
