name: Java CI with Gradle

on:
  pull_request:
    branches:
      - main
    types: [closed]
    paths:
      - 'eks-demo/**'
    
permissions:
  id-token: write
  contents: write
  packages: write

env:
  REGION: ap-northeast-2
  APP_NAME: eks-demo
  TRIVY_VERSION: 0.74.0

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper for Trivy Scan
        run: ./gradlew bootBuildImage --imageName=${{ env.APP_NAME }}:ci

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy 게이트 (고칠 수 있는 CRITICAL이 있으면 실패)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ${{ env.APP_NAME }}:ci


  build:
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ./eks-demo
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Get Short SHA in 8 Length
    - name: get shortsha
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short=8 ${{ github.sha }})" >> $GITHUB_OUTPUT

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew bootBuildImage --imageName=${{ secrets.AWS_ACCOUNT_NUM }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.APP_NAME }}:d${{ steps.vars.outputs.sha_short }}

    # AWS 인증
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.REGION }}
        role-to-assume: ${{ secrets.ASSUME_IAM_ROLE }}
        role-session-name: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

    # ECR LOGIN
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Publish Docker image
      run: |
          docker push ${{ secrets.AWS_ACCOUNT_NUM }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.APP_NAME }}:d${{ steps.vars.outputs.sha_short }}    

    - name: Change Image tag
      run: |
        sed -i "s|tag: .*|tag: \"d${{ steps.vars.outputs.sha_short }}\"|g" ../helm-values/dev/eks-demo-values.yaml
        ls
      shell: bash

    - name: GIT commit and push docs
      env:
        CI_COMMIT_MESSAGE: Update Tag - d${{ steps.vars.outputs.sha_short }}
        CI_COMMIT_AUTHOR: mjkim134
      run: |
        git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
        git config --global user.email "mjkim134@gmail.com"
        git status
        git add ../helm-values/dev/eks-demo-values.yaml
        git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
        git push origin main