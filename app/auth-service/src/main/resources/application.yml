server:
  port: 8081 # API Gateway(8080)와 겹치지 않게 8081로 설정

spring:
  application:
    name: auth-service

  # 1. MySQL 데이터베이스 연결 설정
  datasource:
    # 환경변수가 없으면 주소 뒤의 localhost 값(기본값)을 사용함
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update # 로컬 테스트용 테이블 자동 생성 (운영에선 주로 validate나 none)
    show-sql: true # 콘솔에 SQL 쿼리 출력
    properties:
      hibernate:
        format_sql: true # SQL 이쁘게 포맷팅

  # 3. Redis 연결 설정
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# 4. [DevOps 필수] Actuator 및 Prometheus 메트릭 노출 설정
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus # 헬스체크와 프로메테우스 엔드포인트만 오픈
  endpoint:
    health:
      show-details: always # 쿠버네티스 liveness/readiness 프로브를 위해 상세 정보 노출