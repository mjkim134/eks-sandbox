apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/mjkim134/eks-sandbox.git
    targetRevision: HEAD
    path: helm-charts/eks-demo
    helm-charts:
      valueFiles:
        - ../../../helm-values/prod/eks-demo-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true