apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mjkim134/eks-sandbox.git
    targetRevision: HEAD
    path: gitops/charts/eks-demo
    helm:
      valueFiles:
        - ../../../helm-values/dev/eks-demo-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true