controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

server:
  ingress:
    enabled: true
    ingressClassName: alb
    hostname: argocd.dev.mjkim.click
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: eks-sandbox-dev
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: "200"
      alb.ingress.kubernetes.io/certificate-arn: >-
        arn:aws:acm:ap-northeast-2:728138073365:certificate/1cd6458c-4b7f-4eea-98ce-4acb209259cc
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      external-dns.alpha.kubernetes.io/hostname: argocd.dev.mjkim.click
    paths:
    - /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extensions:
    enabled: true
  initContainers:
    - name: download-rollout-extension
      image: curlimages/curl
      command: ["/bin/sh", "-c"]
      args:
        - |
          curl -L -o /tmp/extension.tar.gz https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.6/extension.tar.gz
          tar -xf /tmp/extension.tar.gz -C /shared/app/custom/extensions          
      volumeMounts:
        - name: extensions
          mountPath: /shared/app/custom/extensions

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    server.insecure: true

global:
  nodeSelector:
    eks.amazonaws.com/nodegroup: init
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"