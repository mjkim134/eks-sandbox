image:
  repository: 728138073365.dkr.ecr.ap-northeast-2.amazonaws.com/eks-sandbox
  pullPolicy: IfNotPresent
  tag: "d319512cf"

nameOverride: "eks-demo"
fullnameOverride: "eks-demo"
namespace: eks-demo

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "alb"
  annotations: 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: eks-sandbox-dev
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: >-
      arn:aws:acm:ap-northeast-2:728138073365:certificate/1cd6458c-4b7f-4eea-98ce-4acb209259cc
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    external-dns.alpha.kubernetes.io/hostname: "eks-demo.dev.mjkim.click"  
  hosts:
    - host: eks-demo.dev.mjkim.click
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080

nodeSelector:
  eks.amazonaws.com/nodegroup: init