metadata:
  name: kimpala-dev

clusterName: "kimpala-dev"
nodeName: "kimpala-dev-karpenter-node"
env: "dev"

nodePool:
  arch:
    - "amd64"
  capacityTypes:
    - "spot"
  instanceTypes:
    - "t3a.medium"
    - "t3.medium"
  expireAfter: "720h"
  limitCpu: 1000
  limitMemory: 1000Gi

nodeClass:
  role: arn:aws:iam::728138073365:role/eks-kimpala-dev-karpenter-node