alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack-secret
    nodeSelector:
      eks.amazonaws.com/nodegroup: init
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 6h
      receiver: 'slack-notifications'
      routes:
      - receiver: 'null'
        matchers:
          - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'null'
    - name: 'slack-notifications'
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-secret/slack-webhook-url'
        channel: '#eks-sandbox-prod-alertmanager'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: "summary: {{ .CommonAnnotations.summary }}\ndescription: {{ .CommonAnnotations.description }}"