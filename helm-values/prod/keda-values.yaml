nodeSelector:
  eks.amazonaws.com/nodegroup: init
tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"

podDisruptionBudget:
  operator:
    minAvailable: 1
  metricServer:
    minAvailable: 1
    
prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
  operator:
    enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  operator:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::728138073365:role/keda-prod-role
  metricServer:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::728138073365:role/keda-prod-role