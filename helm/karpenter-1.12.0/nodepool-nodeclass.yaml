apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium","t3a.medium"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: init-eks-node-group-2026061503264244190000000d
  amiSelectorTerms:
    - alias: "al2023@v20260423"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kimpala-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kimpala-dev
  tags:
      Service: "Test"
      Organization: "tech"
      Team: "tech/devops"
      Resource: "eks"
      Env: "dev"
      Terraformed: "true"