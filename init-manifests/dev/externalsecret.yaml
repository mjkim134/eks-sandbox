apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm-parameter-store
    kind: ClusterSecretStore
  target:
    name: slack-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook
      remoteRef:
        key: /eks-sandbox/dev/alertmanager/slack-webhook

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-ssm-parameter-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-password-secret
    creationPolicy: Owner
    template:
      data:
        admin-user: "admin"
        admin-password: "{{ .grafana-admin-password }}"
    data:
      - secretKey: grafana-admin-password
        remoteRef:
          key: /eks-sandbox/dev/grafana/admin-password